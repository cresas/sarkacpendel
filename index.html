<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Cresas - Emre">

<title>Sarkaç Pendeli Simülasyonu</title>
<style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            margin: 0;
            box-sizing: border-box;
        }

        .LEIFI_animation {
            width: 800px;
            max-width: 100%; 
            display: flex;
            flex-direction: row; 
            border: 1px solid #ccc;
            background-color: #FAFAFA;
            overflow: hidden;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .LEIFI_parameter {
            flex-basis: 260px; 
            flex-shrink: 0; 
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px; 
            background: #FAFAFA;
            box-sizing: border-box;
        }

        .LEIFI_leinwand {
            flex-grow: 1; 
            border-left: 1px solid #ccc;
            min-width: 0; 
        }
        
        /* --- KONTROL PANELİ GRUPLARI --- */

        .panel-group {
            display: flex;
            flex-direction: column;
            gap: 10px; 
        }
        
        /* 1. Grup: Butonlar (İsteğiniz üzere düzenlendi) */
        .group-buttons button {
            appearance: auto;
            background-color: buttonface;
            border-width: 2px;
            border-style: outset;
            border-color: buttonborder;
            color: buttontext;
            cursor: default;
            width: 100%; /* Konteynere uyması için */
            height: 30px;
            padding: 1px 6px;
            font-family: sans-serif;
            font-size: 13px;
            box-sizing: border-box;
        }

        .group-buttons button:active {
            border-style: inset; /* Tıklama efekti */
        }

        /* 2. Grup: Ayarlar (Yay sabiti, Kütle vb.) */
        .setting-item {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            gap: 10px;
        }
        
        .setting-item label {
            white-space: nowrap; 
            font-weight: bold;
            flex-shrink: 0; 
        }
        
        .setting-item .input-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .setting-item .input-group input[type="text"] {
            width: 70px;
            text-align: right;
            border: 1px solid #ccc;
            padding: 4px;
            box-sizing: border-box;
        }
        
        .setting-item .input-group span {
            width: 35px; 
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
            justify-content: flex-start; /* "Ağır çekim" sola dayalı olsun */
        }
        
        /* 3. Grup: Radyo Butonlar (Uzama, Hız vb.) */
        .radio-item {
            display: flex;
            align-items: center;
            gap: 5px; 
        }

        /* 4. Grup: Alt Bilgi (Kaldırıldı) */
        /* .group-footer artık yok */
        
        /* --- CANVAS ALANI --- */
        
        .LEIFI_leinwand {
            overflow: hidden; /* PC'de kaydırma çubuğu olmasın */
        }

        #WF19_cv {
            /* PC'de: Canvas 540x400 bitmap'ini konteynere sığacak şekilde ölçekler */
            width: 100%; 
            height: auto; /* En-boy oranını koru */
            display: block; 
        }
        
   

/* --- MOBİL UYUMLULUK --- */

@media (max-width: 800px) {
    .LEIFI_animation {
        flex-direction: column; 
        width: 100%;
        height: auto; 
    }
    
    .LEIFI_parameter {
        flex-basis: auto; 
        width: 100%; 
        overflow-y: visible; 
    }
    
    .LEIFI_leinwand {
        border-left: none; 
        border-top: 1px solid #000; 
        width: 100%;
        overflow-x: auto; 
        justify-content: flex-start;
        align-items: flex-start;
    }
    
    #WF18_cv {
        width: 540px;
        height: 400px; 
    }
}
</style>
</head>
<body>

<div class="LEIFI_animation">
    
    <div class="LEIFI_parameter">
        
        <div class="panel-group group-buttons">
            <button class="LEIFI_button" id="WF18_bu2">Başlat</button>
            <button class="LEIFI_button" id="WF18_bu1">Geri</button>
        </div>

        <div class="panel-group group-settings">
            <div class="checkbox-item">
                <input type="checkbox" class="LEIFI_checkbox" id="WF18_cbSlow" name="WF18_cbSlow" value="on">
                <label class="LEIFI_label" for="WF18_cbSlow">Ağır çekim</label>
            </div>
            
            <div class="setting-item">
                <span class="LEIFI_span">Sarkaç uzunluğu:</span>
                <input type="text" class="LEIFI_text" id="WF18_ipL" value="5,000">
                <span class="LEIFI_span">m</span>
            </div>
            
            <div class="setting-item">
                <span class="LEIFI_span">Yer çekimi ivmesi:</span>
                <input type="text" class="LEIFI_text" id="WF18_ipG" value="9,81">
                <span class="LEIFI_span">m/s²</span>
            </div>
            
            <div class="setting-item">
                <span class="LEIFI_span">Kütle:</span>
                <input type="text" class="LEIFI_text" id="WF18_ipM" value="1,000">
                <span class="LEIFI_span">kg</span>
            </div>

            <div class="setting-item">
                <span class="LEIFI_span">Genlik:</span>
                <input type="text" class="LEIFI_text" id="WF18_ipA" value="10,0">
                <span class="LEIFI_span">°</span>
            </div>
        </div>

        <div class="panel-group group-options">
            <div class="radio-item">
                <input type="radio" class="LEIFI_radio" id="WF18_rbY" name="bg" value="on" checked>
                <label class="LEIFI_label" for="WF18_rbY" style="color:#ff0000">Uzama (yer değiştirme)</label>
            </div>
            <div class="radio-item">
                <input type="radio" class="LEIFI_radio" id="WF18_rbV" name="bg" value="on">
                <label class="LEIFI_label" for="WF18_rbV" style="color:#C3C800">Hız</label>
            </div>
            <div class="radio-item">
                <input type="radio" class="LEIFI_radio" id="WF18_rbA" name="bg" value="on">
                <label class="LEIFI_label" for="WF18_rbA" style="color:#5A145A">İvme</label>
            </div>
            <div class="radio-item">
                <input type="radio" class="LEIFI_radio" id="WF18_rbF" name="bg" value="on">
                <label class="LEIFI_label" for="WF18_rbF" style="color:#9999FF">Kuvvet</label>
            </div>
            <div class="radio-item">
                <input type="radio" class="LEIFI_radio" id="WF18_rbE" name="bg" value="on">
                <label class="LEIFI_label" for="WF18_rbE" style="color:#000000">Enerji</label>
            </div>
        </div>
        
    </div>

    <div class="LEIFI_leinwand">
        <canvas width="540" height="400" id="WF18_cv">HTML5-Canvas desteklenmiyor!</canvas>
    </div>
    
</div>

<script>
// Sarkaç Pendeli


// *******************************************************************************
// * Author: Cresas - Emre                                                  *

// ******************************************************************************* 

document.addEventListener("DOMContentLoaded", Fadenpendel(), false); // Sayfa yüklendikten sonra başlatma metodunu çağır

function Fadenpendel() {

// Sarkaç Pendeli, Türkçe metinler
// cresas- emre

var text01 = ["Başlat", "Duraklat", "Devam"];
var text02 = "Maksimum";
var text03 = "Uzama (yer değiştirme)";
var text04 = "Hız"; 
var text05 = "İvme (teğetsel bileşen)";
var text06 = "Kuvvet (teğetsel bileşen)";
var text07 = "Potansiyel Enerji";
var text08 = "Kinetik Enerji";
var text09 = "Toplam Enerji";
var text10 = "(s)";
var text11 = "(m)";
var text12 = "(m/s)";
var text13 = "(m/s²)";
var text14 = "(N)";
var text15 = "(J)";
var text16 = "Salınım süresi";

var decimalSeparator = ",";                                // Ondalık ayırıcı (Virgül)
var symbolTime = "t";                                      // Zaman için sembol
var symbolElongation = "s";                                // Uzama için sembol
var symbolVelocity = "v";                                  // Hız için sembol
var symbolAcceleration = "a";                              // İvme için sembol
var symbolTangential = "";                             // Teğetsel için sembol
var symbolForce = "F";                                     // Kuvvet için sembol
var symbolEnergy = "E";                                    // Enerji için sembol
var symbolPotential = "pot";                               // Potansiyel için sembol
var symbolKinetic = "kin";                                 // Kinetik için sembol
var second = "s";                                          // Saniye için sembol
var meter = "m";                                           // Metre için kısaltma
var meterPerSecond = "m/s";                                // Metre/saniye kısaltması
var meterPerSecond2 = "m/s\u00b2";                         // Metre/saniye² kısaltması
var newton = "N";                                          // Newton kısaltması
var joule = "J";                                           // Joule kısaltması

// Farben:

// var colorBackground = "#FAFAFA";                           // Arka plan rengi
var colorClock1 = "#808080";                               // Dijital saat rengi (dış)
var colorClock2 = "#000000";                               // Gösterge arka plan rengi
var colorClock3 = "#ff0000";                               // Rakamların rengi
var colorElongation = "#ff0000";                           // Uzama rengi
var colorVelocity = "#C3C800";                             // Hız rengi
var colorAcceleration = "#5A145A";                         // İvme rengi
var colorForce = "#7FBCFF";                                // Kuvvet rengi
var colorBody = "#ffffff";                                 // Sarkaç cisminin rengi

// Sonstige Konstanten:

var DEG = Math.PI/180;                                     // Açı derecesi
var ax = 120, ay = 30;                                     // Asma noktasının konumu (Piksel)
var xD = 260;                                              // x-Koordinat başlangıç
var yD1 = 180, yD2 = 165;                                  // y-Koordinat başlangıç
var FONT1 = "normal normal bold 12px sans-serif";          // Yazı tipi
var tPix = 20;                                             // Dönüştürme faktörü (Piksel/saniye)

// Attribute:

var canvas, ctx;                                           // Çizim alanı, Grafik bağlamı
var width, height;                                         // Çizim alanı boyutları (Piksel)
var bu1, bu2;                                              // Butonlar (Sıfırla, Başlat/Duraklat/Devam)
var cbSlow;                                                // Ağır çekim seçeneği
var ipL, ipG, ipM, ipA;                                    // Giriş alanları
var rbY, rbV, rbA, rbF, rbE;                               // Radyo butonları
var on;                                                    // Hareket bayrağı
var slow;                                                  // Ağır çekim bayrağı
var t0;                                                    // Başlangıç zaman noktası
var t;                                                     // Şu anki zaman (s)
var tU;                                                    // Grafik başlangıç zamanı (s)
var l;                                                     // Sarkaç uzunluğu (m)
var lPix;                                                  // Sarkaç uzunluğu (Piksel)
var g;                                                     // Yer çekimi ivmesi (m/s²)
var m;                                                     // Kütle (kg)
var omega;                                                 // Açısal frekans (rad/s)
var tPer;                                                  // Salınım süresi (s)
var phi;                                                   // Faz açısı (Radyan)
var sinPhi, cosPhi;                                        // Trigonometrik değerler
var alpha0;                                                // Maksimum sapma açısı (Radyan)
var alpha;                                                 // Şu anki sapma açısı (Radyan)
var sinAlpha, cosAlpha;                                    // Trigonometrik değerler
var yPix;                                                  // Dönüştürme faktörü (Piksel/SI-Birimi)
var px, py;                                                // Sarkaç cisminin konumu (Piksel)
var nrSize;                                                // İncelenen büyüklüğün numarası


start();

// Start:

function start () {
  canvas = document.getElementById("WF18_cv");                  // Çizim alanı
  width = canvas.width; height = canvas.height;            // Boyutlar (Piksel)
  ctx = canvas.getContext("2d");                           // Grafik bağlamı
  bu1 = document.getElementById("WF18_bu1");                    // Sıfırlama butonu
  bu2 = document.getElementById("WF18_bu2");                    // Başlatma butonu
  bu2.state = 0;                                           // Başlangıç durumu (animasyon başlangıcından önce)
  cbSlow = document.getElementById("WF18_cbSlow");              // Ağır çekim seçeneği
  cbSlow.checked = false;                                  // Ağır çekim kapalı
  ipL = document.getElementById("WF18_ipL");                    // Sarkaç uzunluğu giriş alanı
  ipG = document.getElementById("WF18_ipG");                    // Yer çekimi ivmesi giriş alanı
  ipM = document.getElementById("WF18_ipM");                    // Kütle giriş alanı
  ipA = document.getElementById("WF18_ipA");                    // Genlik giriş alanı
  rbY = document.getElementById("WF18_rbY");                    // Radyo butonu Uzama
  rbY.checked = true;                                      // Radyo butonunu seç
  rbV = document.getElementById("WF18_rbV");                    // Radyo butonu Hız
  rbA = document.getElementById("WF18_rbA");                    // Radyo butonu İvme
  rbF = document.getElementById("WF18_rbF");                    // Radyo butonu Kuvvet
  rbE = document.getElementById("WF18_rbE");                    // Radyo butonu Enerji
  
  setButton2State(0);                                      // Buton durumunu ayarla

  l = 5;                                                   // Başlangıç değeri Sarkaç uzunluğu (m)
  g = 9.81;                                                // Başlangıç değeri Yer çekimi ivmesi (m/s²)
  m = 1;                                                   // Başlangıç değeri Kütle (kg)
  alpha0 = 10*DEG;                                         // Başlangıç değeri Açı genliği (Radyan) 
  updateInput();                                           // Giriş alanlarını güncelle 
  calculation();                                           // Hesaplamalar (Yan etki!)
    
  on = false;                                              // Animasyon kapalı
  slow = false;                                            // Ağır çekim kapalı
  t = 0;                                                   // Şu anki zaman (s)
  tU = 0;                                                  // Grafik başlangıç zamanı (s)
  t0 = null;                                               // Başlangıç zaman noktası (animasyon için)
  setInterval(paint,40);                                   // Zamanlayıcı aralığı 0,040 s
  
  bu1.onclick = reactionReset;                             // Sıfırlama butonu tepkisi
  bu2.onclick = reactionStart;                             // Başlatma butonu tepkisi
  cbSlow.onclick = reactionSlow;                           // Ağır çekim seçeneği tepkisi
  ipL.onkeydown = reactionEnter;                           // Enter tuşu tepkisi (Sarkaç uzunluğu girişi)
  ipG.onkeydown = reactionEnter;                           // Enter tuşu tepkisi (Yer çekimi ivmesi girişi)
  ipM.onkeydown = reactionEnter;                           // Enter tuşu tepkisi (Kütle girişi)
  ipA.onkeydown = reactionEnter;                           // Enter tuşu tepkisi (Genlik girişi)
  rbY.onclick = reactionRadioButton;                       // Radyo butonu Uzama tepkisi
  rbV.onclick = reactionRadioButton;                       // Radyo butonu Hız tepkisi
  rbA.onclick = reactionRadioButton;                       // Radyo butonu İvme tepkisi
  rbF.onclick = reactionRadioButton;                       // Radyo butonu Kuvvet tepkisi
  rbE.onclick = reactionRadioButton;                       // Radyo butonu Enerji tepkisi
  nrSize = 0;                                              // Uzama seçildi  
    
  } // start metodunun sonu
  
// Başlat/Duraklat/Devam butonu için durum belirleme:
  
function setButton2State (st) {
  bu2.state = st;                                          // Durumu kaydet
  bu2.innerHTML = text01[st];                              // Metni güncelle
  }
  
// Başlat/Duraklat/Devam butonunun durumunu değiştir:
  
function switchButton2 () {
  var st = bu2.state;                                      // Şu anki durum
  if (st == 0) st = 1;                                     // Eğer başlangıç durumu ise, başlat
  else st = 3-st;                                          // Animasyon ve duraklatma arasında değiş
  setButton2State(st);                                     // Yeni durumu kaydet, metni değiştir
  }
  
// Giriş alanlarının etkinleştirilmesi veya devre dışı bırakılması:
// p ... Girişin mümkün olup olmadığı için bayrak

function enableInput (p) {
  ipL.readOnly = !p;                                       // Sarkaç uzunluğu için giriş alanı
  ipG.readOnly = !p;                                       // Yer çekimi ivmesi için giriş alanı
  ipM.readOnly = !p;                                       // Kütle için giriş alanı
  ipA.readOnly = !p;                                       // Açı genliği için giriş alanı
  }
  
// Sıfırlama butonu tepkisi:
// Yan etki t, tU, on, slow
   
function reactionReset () {
  setButton2State(0);                                      // Başlat/Duraklat/Devam butonunun durumu
  enableInput(true);                                       // Giriş alanlarını etkinleştir
  t = tU = 0;                                              // Zaman değişkenini sıfırla
  on = false;                                              // Animasyon kapalı
  slow = cbSlow.checked;                                   // Ağır çekim bayrağı
  reaction();                                              // Girilen değerleri al ve hesapla
  paint();                                                 // Yeniden çiz
  }
  
// Başlat/Duraklat/Devam butonuna tepki:
// Yan etki t, tU, on, slow, l, g, m, alpha0, omega, tPer, lPix, phi, sinPhi, cosPhi, alpha, sinAlpha, cosAlpha, px, py

function reactionStart () {
  if (bu2.state != 1) t0 = new Date();                     // Eğer animasyon açıldıysa, yeni başlangıç zaman noktası
  switchButton2();                                         // Butonun durumunu değiştir
  enableInput(false);                                      // Giriş alanlarını devre dışı bırak
  on = (bu2.state == 1);                                   // Animasyon bayrağı
  slow = cbSlow.checked;                                   // Ağır çekim bayrağı
  reaction();                                              // Girilen değerleri al ve hesapla
  if (bu2.state == 1 && !t0) {                             // Animasyonu başlat
      t0 = new Date();
  } else if (bu2.state == 1) { 
      t0 = new Date(); 
  }
  paint();                                                 // Yeniden çiz
  }
  
// Ağır çekim seçeneği tepkisi:
// Yan etki slow

function reactionSlow () {
  slow = cbSlow.checked;                                   // Bayrağı ayarla
  }
  
// Yardımcı rutin: Girişi al ve hesapla
// Yan etki l, g, m, alpha0, omega, tPer, lPix

function reaction () {
  input();                                                 // Girilen değerleri al (gerekiyorsa düzeltilmiş)
  calculation();                                           // Hesaplamalar
  }
  
// Tuşa basma tepkisi (sadece Enter tuşu):
  
function reactionEnter (e) {
  if (e.key && String(e.key) == "Enter"                    // Eğer Enter tuşu (Firefox/Internet Explorer) ...
  || e.keyCode == 13)                                      // Eğer Enter tuşu (Chrome) ...
    reaction();                                            // ... verileri al ve hesapla                          
  paint();                                                 // Yeniden çiz
}

// Radyo butonu tepkisi:
// Yan etki nrSize

function reactionRadioButton () {
  if (rbY.checked) nrSize = 0;                             // Ya Uzama ...
  else if (rbV.checked) nrSize = 1;                        // ... ya Hız ...
  else if (rbA.checked) nrSize = 2;                        // ... ya İvme ...
  else if (rbF.checked) nrSize = 3;                        // ... ya Kuvvet ...
  else nrSize = 4;                                         // ... ya da Enerji seç
}

//-------------------------------------------------------------------------------------------------

// Hesaplamalar:
// Yan etki omega, tPer, lPix

function calculation () {
  omega = Math.sqrt(g/l);                                  // Açısal frekans (rad/s)
  tPer = 2*Math.PI/omega;                                  // Salınım süresi (s)
  lPix = 25*l;                                             // Sarkaç uzunluğu (Piksel)
  }
  
// Bir sayıyı karakter dizisine dönüştür:
// n ..... Verilen sayı
// d ..... Hane sayısı
// fix ... Ondalık hane bayrağı (geçerli hanelerin aksine)

function ToString (n, d, fix) {
  var s = (fix ? n.toFixed(d) : n.toPrecision(d));         // Ondalık noktalı karakter dizisi
  return s.replace(".",decimalSeparator);                  // Gerekirse noktayı virgülle değiştir
  }
  
// Bir sayının girişi
// ef .... Giriş alanı
// d ..... Hane sayısı
// fix ... Ondalık hane bayrağı (geçerli hanelerin aksine)
// min ... İzin verilen aralığın minimumu
// max ... İzin verilen aralığın maksimumu
// Dönen değer: sayı veya NaN
  
function inputNumber (ef, d, fix, min, max) {
  var s = ef.value;                                        // Giriş alanındaki karakter dizisi
  s = s.replace(",",".");                                  // Gerekirse virgülü noktaya dönüştür
  var n = Number(s);                                       // Mümkünse sayıya dönüştür
  if (isNaN(n)) n = 0;                                     // Anlamsız girişleri 0 olarak yorumla 
  if (n < min) n = min;                                    // Eğer sayı çok küçükse, düzelt
  if (n > max) n = max;                                    // Eğer sayı çok büyükse, düzelt
  ef.value = ToString(n,d,fix);                            // Giriş alanını gerekirse düzelt
  return n;                                                // Dönen değer
  }
   
// Toplam giriş:
// Yan etki l, g, m, alpha0

function input () {
  l = inputNumber(ipL,3,true,0.5,10);                     // Sarkaç uzunluğu (m)
  g = inputNumber(ipG,2,true,1,100);                      // Yer çekimi ivmesi (m/s²)
  m = inputNumber(ipM,3,true,1,10);                       // Kütle (kg)
  alpha0 = DEG*inputNumber(ipA,1,true,2,20);              // Açı genliği (Radyan)
  }
  
// Giriş alanlarının güncellenmesi:

function updateInput () {
  ipL.value = ToString(l,3,true);                          // Sarkaç uzunluğu giriş alanı (m)
  ipG.value = ToString(g,2,true);                          // Yer çekimi ivmesi giriş alanı (m/s²)
  ipM.value = ToString(m,3,true);                          // Kütle giriş alanı (kg)
  ipA.value = ToString(alpha0/DEG,1,true);                 // Açı genliği giriş alanı (°)
  }
   
//-------------------------------------------------------------------------------------------------

// Varsayılan değerlerle yeni yol:

function newPath () {
  ctx.beginPath();                                         // Yeni yol
  ctx.strokeStyle = "#000000";                             // Çizgi rengi siyah
  ctx.lineWidth = 1;                                       // Çizgi kalınlığı 1
}

// Siyah kenarlı dikdörtgen:
// (x,y) ... Sol üst köşenin koordinatları (Piksel)
// w ....... Genişlik (Piksel)
// h ....... Yükseklik (Piksel)
// c ....... Dolgu rengi (isteğe bağlı)

function rectangle (x, y, w, h, c) {
  if (c) ctx.fillStyle = c;                                // Dolgu rengi
  newPath();                                               // Yeni yol
  ctx.fillRect(x,y,w,h);                                   // Dikdörtgeni doldur
  ctx.strokeRect(x,y,w,h);                                 // Kenarı çiz
  }
  
// Siyah kenarlı daire disk:
// (x,y) ... Merkez koordinatları (Piksel)
// r ....... Yarıçap (Piksel)
// c ....... Dolgu rengi (isteğe bağlı)

function circle (x, y, r, c) {
  if (c) ctx.fillStyle = c;                                // Dolgu rengi
  newPath();                                               // Yeni yol
  ctx.arc(x,y,r,0,2*Math.PI,true);                         // Daire hazırla
  ctx.fill();                                              // Daireyi doldur
  ctx.stroke();                                            // Kenarı çiz
  }
  
// Sarkacı çiz:
// Yan etki alpha, sinAlpha, cosAlpha, px, py

function pendulum () {
  alpha = alpha0*cosPhi;                                   // Sapma (Radyan)                      
  sinAlpha = Math.sin(alpha);                              // Sinus değeri 
  cosAlpha = Math.cos(alpha);                              // Cosinus değeri
  px = ax+lPix*sinAlpha;                                   // Sarkaç cisminin x-koordinatı (Piksel)
  py = ay+lPix*cosAlpha;                                   // Sarkaç cisminin y-koordinatı (Piksel)
  newPath();                                               // Varsayılan değerlerle yeni yol
  ctx.moveTo(ax,ay);                                       // Başlangıç noktası (Asma)
  ctx.lineTo(px,py);                                       // Sarkaç cisminin merkezine kadar devam et
  ctx.closePath();                                         // Yolu kapat
  ctx.stroke();                                            // İp için çizgi çiz
  circle(px,py,5,colorBody);                               // Sarkaç cismi
  }
  
// Dijital saat çiz:

function clock (x, y) {
  rectangle(x-60,y-16,120,32,colorClock1);                 // Gövde
  rectangle(x-50,y-10,100,20,colorClock2);                 // Göstergenin arka planı
  ctx.fillStyle = "#ff0000";                               // Rakamlar için renk
  ctx.font = "normal normal bold 16px monospace";          // Yazı tipi
  ctx.textAlign = "center";                                // Merkezli çıktı
  var displayTime = on || t > 0 ? t : 0;                   // Sadece çalışırken veya t > 0 iken zaman göster
  var n = Math.floor(displayTime/1000);                    // Her 1000 saniyelik zaman bölümlerinin sayısı
  var s = (displayTime-n*1000).toFixed(3)+" "+second;      // Zaman bildirimi (Birim s, her 1000 s yeniden başlatma)
  s = s.replace(".",decimalSeparator);                     // Gerekirse noktayı virgülle değiştir
  while (s.length < 9) s = " "+s;                          // Gerekirse başına boşluk ekle
  ctx.fillText(s,x,y+5);                                   // Zamanı çıktıla
  }
  
// Ok çiz:
// x1, y1 ... Başlangıç noktası
// x2, y2 ... Bitiş noktası
// w ........ Çizgi kalınlığı (isteğe bağlı)
// Dikkat edilmesi gereken: Renk ctx.strokeStyle ile belirlenir.

function arrow (x1, y1, x2, y2, w) {
  if (!w) w = 1;                                           // Eğer çizgi kalınlığı tanımlanmamışsa, varsayılan değer                          
  var dx = x2-x1, dy = y2-y1;                              // Vektorkoordinaten
  var length = Math.sqrt(dx*dx+dy*dy);                     // Uzunluk
  if (length == 0) return;                                 // Uzunluk 0 ise çık
  dx /= length; dy /= length;                              // Einheitsvektor
  var s = 2.5*w+7.5;                                       // Ok ucunun uzunluğu 
  var xSp = x2-s*dx, ySp = y2-s*dy;                        // Ok ucu için yardımcı nokta         
  var h = 0.5*w+3.5;                                       // Halbe Breite der Pfeilspitze
  var xSp1 = xSp-h*dy, ySp1 = ySp+h*dx;                    // Ok ucunun köşesi
  var xSp2 = xSp+h*dy, ySp2 = ySp-h*dx;                    // Ok ucunun köşesi
  xSp = x2-0.6*s*dx; ySp = y2-0.6*s*dy;                    // Ok ucunun içe doğru giren köşesi
  ctx.beginPath();                                         // Yeni yol
  ctx.lineWidth = w;                                       // Çizgi kalınlığı
  ctx.moveTo(x1,y1);                                       // Başlangıç ​​noktası
  if (length < 5) ctx.lineTo(x2,y2);                       // Eğer kısa ok ise, bitiş noktasına kadar devam et, ...
  else ctx.lineTo(xSp,ySp);                                // ... aksi takdirde yeniden girilen köşeye devam et
  ctx.stroke();                                            // Çizgi çiz
  if (length < 5) return;                                  // Eğer kısa ok ise, uç olmasın
  ctx.beginPath();                                         // Ok ucu için yeni yol
  ctx.fillStyle = ctx.strokeStyle;                         // Çizgi rengi gibi dolgu rengi
  ctx.moveTo(xSp,ySp);                                     // Başlangıç noktası (içe doğru giren köşe)
  ctx.lineTo(xSp1,ySp1);                                   // Bir taraftaki noktaya kadar devam et
  ctx.lineTo(x2,y2);                                       // Uca kadar devam et
  ctx.lineTo(xSp2,ySp2);                                   // Diğer taraftaki noktaya kadar devam et
  ctx.closePath();                                         // Başlangıç noktasına geri dön
  ctx.fill();                                              // Pfeilspitze zeichnen 
  }
  
// Sarkaç cisminden vektör oku:
// r ..... Okun uzunluğu
// phi ... Yataya göre açı (Radyan, saat tersi yönde)
  
function arrowPendulum (r, phi) {
  var x = px+r*Math.cos(phi);                             // ok ucunun x koordinatı
  var y = py-r*Math.sin(phi);                             // ok ucunun y koordinatı
  arrow(px,py,x,y,3);                                     // Ok çiz
  }
  
// Text ausrichten (Zeichensatz FONT1):
// s ....... dizesi
// t ....... Tip (0 sol hizalı, 1 merkezli, 2 sağ hizalı)
// (x,y) ... Pozisyon (piksel)

function alignText (s, t, x, y) {
  ctx.font = FONT1;                                        // Font -karakter seti
  if (t == 0) ctx.textAlign = "left";                      // t değerine göre sol hizalı ...
  else if (t == 1) ctx.textAlign = "center";               // ... oder zentriert ...
  else ctx.textAlign = "right";                            // ... veya sağ hizalı
  ctx.fillText(s,x,y);                                     // Metni çıktıla
  }
  
// Yatay eksen (etiket ve işaretlerle) grafik için:
// (x,y) ... orijin (piksel)
  
function horizontalAxis (x, y) {
  ctx.strokeStyle = "#000000";                            // Çizgi rengi siyah
  arrow(x-20,y,x+240,y);                                   // Ok çiz
  alignText(symbolTime,1,x+230,y+15);                      // Etiket (t)
  alignText(text10,1,x+230,y+27);                          // Etiket (s)  
  var t0 = Math.ceil(tU);                                  // İlk işaret için zaman (s)
  var x0 = Math.round(x+tPix*(t0-tU));                    // ilk tikin x koordinatı         
  for (i=0; i<=10; i++) {                                  // Tüm işaretler için ...
    var xs = x0+i*tPix;                                    // x-Koordinate berechnen
    ctx.moveTo(xs,y-3); ctx.lineTo(xs,y+3);                // Tick 
    if (xs >= x+5 && xs <= x+215                           // Eğer işaret çok solda veya çok sağda değilse ... 
    && (t0+i <= 100 || (t0+i)%2 == 0))                     // timing(ler) 100'den az veya  ...
      alignText(""+(t0+i),1,xs,y+13);                      // ... etiket işareti
    }
  ctx.stroke();                                            // İşaretleri çiz
  }
    
// Aşağıdaki grafikler gösterilmektedir:
// (x, y) ... Başlangıç ​​(piksel)
// yDüşük ... Eksenin alt ucu (piksel)
// yYüksek ... Eksenin üst ucu (piksel)
// maxSI ... Maksimum değer (SI birimi)
// Yan etki yPix
  
function verticalAxis (x, y, yLow, yHigh, maxSI) {
  var pot10 = Math.pow(10,Math.floor(Math.log(maxSI)/Math.LN10));    // maxSI'ye en yakın küçük 10'un kuvveti
  var q = maxSI/pot10;                                     // Oran (1 ile 10 arasında)
  var n;                                                   // Zahl der Ticks
  if (q > 5) n = 10; else if (q > 2) n = 5; else n = 2;    // İşaret sayısı için "düzgün" değer 
  ctx.strokeStyle = "#000000";                             // Linienfarbe schwarz
  arrow(x,yLow,x,yHigh);                                   // Ok çiz
  var n0 = (nrSize<4 ? -n : 0);                            // En alt işaretin numarası 
  ctx.beginPath();                                         // Yeni yol                       
  for (i=n0; i<=n; i++) {                                  // Tüm işaretler için ...
    var ys = y-i*100/n;                                    //tick y koordinatı
    ctx.moveTo(x-3,ys); ctx.lineTo(x+3,ys);                // Tick 
    var s = Number(i*pot10).toPrecision(1);                // Etiket için karakter dizisi 
    if (Math.abs(i*pot10) >= 10)                           // Eğer gerekli ise ...
      s = ""+Math.round(i*pot10);                         // ... onun kuvveti gösterimini engelle
    s = s.replace(".",decimalSeparator);                  // Belki noktayı virgüle dönüştürebiliriz
    if ((n < 10 || i%2 == 0) && i != 0)                    // Eğer mantıklı ise ... 
      alignText(s,2,x-3,ys+4);                             // ... etiket işareti
    }
  ctx.stroke();                                            // İşaretleri çiz
  yPix = 100/n/pot10;                                      // Dönüştürme faktörünü güncelle
  }
      
// Sinüs eğrisi (çokgen zinciri ile yaklaşım):
// (x,y) ... Nullpunkt (Pixel)
// per ..... Periode (Pixel)
// ampl .... Amplitude (Pixel)
// xMin .... Minimaler x-Wert (Pixel)
// xMax .... Maximaler x-Wert (Pixel)

function sinus (x, y, per, ampl, xMin, xMax) {
  var omega = 2*Math.PI/per;                               // Yardımcı büyüklük
  newPath();                                               // Yeni yol (varsayılan değerler)
  var xx = xMin;                                           // Sol kenar için x-koordinatı
  ctx.moveTo(xx,y-ampl*Math.sin(omega*(xx-x)));            // Başlangıç noktası 
  while (xx < xMax) {                                      // Sağ kenar henüz ulaşılmadıkça ...
    xx++;                                                  // x-koordinatını artır
    ctx.lineTo(xx,y-ampl*Math.sin(omega*(xx-x)));          // Yeni kısım yolu hazırla
    }
  ctx.stroke();                                            // Eğri için çokgen zinciri çiz
  }
  
// Grafik çiz:

function diagram (type, x, y, yMax) {
  horizontalAxis(x,y);                                     // Yatay eksen etiket ve işaretlerle
  verticalAxis(x,y,y+120,y-135,yMax);                      // Etiketler ve işaretlerle dikey eksen
  sinus(x-type*tPer*5-tU*tPix,y,tPer*tPix,yMax*yPix,x,x+200);   // sinüs eğrisi
  }
  
// Grafikte anlık değer için işaretleme:
// val .... sayısal değer (SI birimi)
// x, y ... orijin
// c ...... renk

function drawMomVal (val, x, y, c) {
  x += (t-tU)*tPix; y -= val*yPix;                         // Merkez koordinatları (Piksel)
  circle(x,y,2,c);                                         // Kenarlı küçük daire
  }
  
// Bir sayı değeri çıktısı:
// s ........ Büyüklüğün adı
// v ........ Zahlenwert
// u ........ Einheit
// n ........ Geçerli rakamların sayısı
// (x1,y) ... Position des Texts (Pixel)
// (x2,y) ... Position des Zahlenwerts (Pixel)
  
function writeValue (s, v, u, n, x1, x2, y) {
  alignText(s+":",0,x1,y);                                 // Büyüklüğün adı
  s = v.toPrecision(n);                                    // İstenen hassasiyetle yuvarla
  s = s.replace(".",decimalSeparator);                     // Nokta yerine virgül olabilir
  alignText(s+" "+u,0,x2,y);                               // Birimli sayı
  }
  
// Merkezli metin ile indeks:
// s1 ...... Normaler Text
// s2 ...... Index
// (x,y) ... Position
    
function centerTextIndex (s1, s2, x, y) {
  var w1 = ctx.measureText(s1).width;                      // s1'in genişliği (Piksel) 
  var w2 = ctx.measureText(s2).width;                      // s2'nin genişliği (Piksel)
  var x0 = x-(w1+w2)/2;                                    // x-Koordinate der Mitte
  alignText(s1,0,x0,y);                                    // Normal metni çıktıla
  alignText(s2,0,x0+w1+1,y+5);                             // İndeksi çıktıla
  }
  
// Uzama çizimi:
// Uzamanın zaman bağımlılığı için grafik, uzama için daire yayı, sayı değerleri

function drawElongation () {
  var sMax = l*alpha0;                                     // Uzamanın maksimum miktarı (m)
  var s = sMax*cosPhi;                                     // Uzamanın anlık değeri (m) 
  diagram(1,xD,yD1,sMax);                                  // Grafik çiz
  alignText(symbolElongation,1,xD-25,yD1-130);             // Etiket (Uzama sembolü)
  alignText(text11,1,xD-25,yD1-118);                       // Etiket (Birim m)
  ctx.beginPath();                                         // Yeni yol
  ctx.lineWidth = 3;                                       // Çizgi kalınlığı
  ctx.strokeStyle = colorElongation;                       // Daire yayı rengi
  var pos = (alpha >= 0);                                  // Sağa sapma bayrağı
  var w0 = (pos ? Math.PI/2 : Math.PI/2-alpha);            // Daire yayı başlangıç açısı (Radyan)
  var w1 = (pos ? Math.PI/2-alpha : Math.PI/2);            // Daire yayı bitiş açısı (Radyan)
  ctx.arc(ax,ay,lPix,w0,w1,true);                          // Daire yayı hazırla
  ctx.stroke();                                            // Daire yayı çiz
  drawMomVal(s,xD,yD1,colorElongation);                    // Grafikte anlık değeri işaretle 
  ctx.fillStyle = colorElongation;                         // Uzama rengi (sayı değerleri)  
  writeValue(text03,s,meter,3,xD,xD+200,height-50);        // Anlık değeri belirt
  writeValue("("+text02,sMax,meter+")",3,xD,xD+200,height-30);  // Maksimum değeri belirt
  }
  
// Zeichnung zur Geschwindigkeit:
// Hızın zaman bağımlılığı için grafik, hız vektörü için ok, sayısal değerler

function drawVelocity () {
  var vMax = l*alpha0*omega;                             // Maksimum hız (m/s)
  var v = -vMax*sinPhi;                                    // Mevcut hız (m/s)
  diagram(2,xD,yD1,vMax);                                  // Diagramm zeichnen
  alignText(symbolVelocity,1,xD-28,yD1-130);               // Etiket (Hız sembolü)
  alignText(text12,1,xD-28,yD1-118);                       // Etiket (birim m/s)
  ctx.strokeStyle = colorVelocity;                         // Hız için renk
  arrowPendulum(v*yPix,alpha0*cosPhi);                     // Hız vektörü için ok
  drawMomVal(v,xD,yD1);                                   
  ctx.fillStyle = colorVelocity;                           // Hız için renk (sayısal değerler)    
  writeValue(text04,v,meterPerSecond,3,xD,xD+200,height-50);    // Geçerli değeri belirtin
  writeValue("("+text02,vMax,meterPerSecond+")",3,xD,xD+200,height-30);   
  }
  
// Zeichnung zur Tangentialbeschleunigung:
// İvmenin zaman bağımlılığı için grafik, ivme vektörü için ok, sayısal değerler
  
function drawAcceleration () {
  var aMax = l*alpha0*omega*omega;                        
  var a = -aMax*cosPhi;                                   
  diagram(3,xD,yD1,aMax);                                  // Diagramm zeichnen
  centerTextIndex(symbolAcceleration,symbolTangential,xD-30,yD1-130);     // Etiket (Teğetsel ivme sembolü) 
  alignText(text13,1,xD-30,yD1-113);                      
  ctx.strokeStyle = colorAcceleration;                     // İvme için renk
  arrowPendulum(a*yPix,alpha0*cosPhi);                     // Teğetsel ivme vektörü için ok
  drawMomVal(a,xD,yD1);                                    
  ctx.fillStyle = colorAcceleration;                       // İvme için renk (sayısal değerler)    
  writeValue(text05,a,meterPerSecond2,3,xD-30,xD+220,height-50);     
  writeValue("("+text02,aMax,meterPerSecond2+")",3,xD-30,xD+220,height-30);   
  }
      
// Zeichnung zur Tangentialkraft:
// Kuvvetin zaman bağımlılığı için grafik, kuvvet vektörü için ok, sayısal değerler
  
function drawForce () {
  var fMax = m*l*alpha0*omega*omega;                       // Maksimum teğet kuvvet miktarı (N)
  var f = -fMax*cosPhi;                                   //Teğetsel kuvvetinin anlık değeri (N)
  diagram(3,xD,yD1,fMax);                                  // // Diyagram çiz
  centerTextIndex(symbolForce,symbolTangential,xD-30,yD1-130);  // Etiket (Teğetsel kuvvet sembolü)
  alignText(text14,1,xD-30,yD1-113);                       /// Etiket (Birim N)
  ctx.strokeStyle = colorForce;                            // Kuvvet için renk
  arrowPendulum(f*yPix,alpha0*cosPhi);                     // Teğetsel kuvvet vektörü için ok
  drawMomVal(f,xD,yD1);                                    // Diyagramdaki mevcut değer işaretle
  ctx.fillStyle = colorForce;                              // Kuvvet için renk (sayısal değerler)    
  writeValue(text06,f,newton,3,xD-30,xD+220,height-50);    // cari değeri belirtiliyor
  writeValue("("+text02,fMax,newton+")",3,xD-30,xD+220,height-30);   // Maksimum değeri belirtilir
  }
      
// Potansiyel ve kinetik enerjinin zaman bağımlılığı için grafik:
// (x,y) .... Ursprung (Pixel)
// e ........ Gesamtenergie (J)

function diagramEnergy (x, y, e) {
  horizontalAxis(x,y);                                     // Yatay eksen etiket ve işaretlerle
  verticalAxis(x,y,y+20,y-125,e);                         // Etiketler ve işaretlerle dikey eksen
  var x1 = x+200;                                          // Sağ kenar için x-koordinatı (Piksel)
  var y1 = y-e*yPix;                                       // Toplam enerji için y-koordinatı (Piksel)
  ctx.beginPath();                                         // Yeni yol
  ctx.moveTo(x,y1); ctx.lineTo(x1,y1);                     // Toplam enerji için yatay çizgi hazırla
  ctx.stroke();                                            // Çizgi çiz
  var xx = x-tU*tPix;                                      // x-Koordinate des verschobenen Ursprungs (Pixel)
  var per = tPer*10;                                       // Sinüs eğrileri için periyot (Piksel)
  var ampl = e*yPix/2;                                     // Sinüs eğrileri için genlik (Piksel)
  sinus(xx-tPer*2.5,y-ampl,per,ampl,x,x+200);              // Potansiyel enerji için sinüs eğrisi
  sinus(xx-tPer*7.5,y-ampl,per,ampl,x,x+200);              // Kinetik enerji için sinüs eğrisi
  }
      
// Enerji çizimi:

function drawEnergy () {
  var e = l*alpha0*omega; e = m*e*e/2;                     // Gesamtenergie (J)
  var part = cosPhi*cosPhi;                                // Potansiyel enerji için kesir
  var eP = e*part, eK = e-eP;                              // Potentielle und kinetische Energie (J)
  diagramEnergy(xD,yD2,e);                                 // Her iki enerji formu için zaman bağımlılığı grafiği 
  centerTextIndex(symbolEnergy,symbolPotential,xD-30,yD2-125); 
  alignText(text15,1,xD-30,yD2-108);                       
  centerTextIndex(symbolEnergy,symbolKinetic,xD+30,yD2-125);    
  alignText(text15,1,xD+30,yD2-108);                       
  ctx.fillStyle = colorElongation;                         // Potansiyel enerji için renk (veya Uzama)
  writeValue(text07,eP,joule,3,xD,xD+200,height-70);           
  ctx.fillStyle = colorVelocity;                           // Kinetik enerji için renk
  writeValue(text08,eK,joule,3,xD,xD+200,height-50);       
  ctx.fillStyle = "#000000";                               // Toplam enerji için renk
  writeValue(text09,e,joule,3,xD,xD+200,height-30);        
  var dy = part*100;                                       // Potansiyel enerji için dikdörtgenin yüksekliği (Piksel)
  rectangle(300,205,50,dy,colorElongation);                // Potansiyel enerji için dikdörtgen
  if (part > 0.001 || on)                                  // Eğer potansiyel enerji çok küçük değilse ...
    alignText(text07,0,360,220);                          
  rectangle(300,205+dy,50,100-dy,colorVelocity);           // Kinetik enerji için dikdörtgen
  if (part < 0.999 || on)                                  // Eğer kinetik enerji çok küçük değilse ... 
    alignText(text08,0,360,300);                         
  drawMomVal(eP,xD,yD2,colorElongation);                   // Anlık potansiyel enerji için işaret
  drawMomVal(eK,xD,yD2,colorVelocity);                     // Anlık kinetik enerji için işaret
  }

// Grafik çıktısı:
//  etki t, tU, phi, sin Phi, cos Phi, alpha, sin Alpha, cos Alpha, px, py
  
function paint () {
//  ctx.fillStyle = colorBackground;                         // Arka plan rengi
//  ctx.fillRect(0,0,width,height);                          // Arka planı doldur
    ctx.clearRect(0,0,width,height);
  rectangle(ax-50,ay-5,100,5,"#000000");                   // Asma noktası (Tavan)
  if (on) {                                                // Eğer animasyon açık ise ...
    var t1 = new Date();                                   // ... Şu anki saat
    var dt = (t1-t0)/1000;                                 // ... Zaman aralığının uzunluğu (s)
    if (slow) dt /= 10;                                    // ... Yavaş çekim ise zaman aralığını 10'a böl
    t += dt;                                              // ... güncelleme zamanı değişkeni
    t0 = t1;                                             // ... Yeni başlangıç ​​saati
    }
  tU = (t<5 ? 0 : t-5);                                    // Grafik başlangıcı için zaman (s)
  phi = omega*t;                                           // Faz açısı (Radyan) 
  sinPhi = Math.sin(phi); cosPhi = Math.cos(phi);          // Trigonometrik değerler
  pendulum();                                              //  sarkaç çizim
  clock(ax,340);                                           // Dijital  saat çizimi
  switch (nrSize) {                                        // İncelenen büyüklüğe göre ...
    case 0: drawElongation(); break;                       // ... Uzamayı gösteren çizim
// ... Hızı gösteren çizim
// ... Teğetsel ivmeyi gösteren çizim
// ... Teğetsel kuvveti gösteren çizim
// ... Enerjiyi gösteren çizim
    case 1: drawVelocity(); break;                         
    case 2: drawAcceleration(); break;                    
    case 3: drawForce(); break;                            
    case 4: drawEnergy(); break;                           
    }
  var s = text16+":  "+tPer.toPrecision(3)+" "+second;     // Salınım süresi için karakter dizisi
  s = s.replace(".",decimalSeparator);                     // Nokta yerine virgül olabilir
  ctx.fillStyle = "#000000";                               // Metin için renk
  alignText(s,1,ax,height-30);                             // Salınım süresi karakter dizisini çıktıla
  }
}
</script>
